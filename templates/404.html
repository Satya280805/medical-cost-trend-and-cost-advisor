<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - 404</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
  <style>
    .not-found-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #e0e7ff 0%, #f8fafc 60%, #f1f5f9 100%);
      padding: 24px;
      text-align: center;
    }
    .not-found-card {
      background: #ffffff;
      max-width: 500px;
      width: 100%;
      border-radius: var(--radius-lg, 16px);
      padding: 48px 36px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
      border: 1px solid var(--card-border, #e2e8f0);
    }
    .not-found-code {
      font-size: 72px;
      font-weight: 800;
      color: var(--accent-blue, #2563eb);
      line-height: 1;
      margin-bottom: 12px;
    }
    .not-found-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .not-found-desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="not-found-container">
    <div class="not-found-card">
      <div class="not-found-code">404</div>
      <h1 class="not-found-title">Page Not Found</h1>
      <p class="not-found-desc">The requested page URL was not found. Please choose an option below to continue.</p>
      
      <div class="btn-group">
        <a href="{{ url_for('home') }}" class="btn-primary" style="background: transparent; color: var(--accent-blue, #2563eb); border: 1px solid var(--accent-blue, #2563eb); box-shadow: none;">
          <i class="fa-solid fa-house"></i>
          <span>Home</span>
        </a>
        <a href="{{ url_for('login') }}" class="btn-primary">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Sign In</span>
        </a>
        <a href="{{ url_for('dashboard') }}" class="btn-primary" style="background-color: #0f172a;">
          <i class="fa-solid fa-table-columns"></i>
          <span>Dashboard</span>
        </a>
      </div>
    </div>

    <!-- 404 Page 2026 Footer -->
    <div style="text-align: center; margin-top: 24px; font-size: 12px; color: #94a3b8; font-weight: 500;">
      Trend2Action Platform &nbsp;|&nbsp; &copy; 2026 All rights reserved.
    </div>
  </div>
</body>
</html>
