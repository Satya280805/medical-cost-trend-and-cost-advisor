<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Trend2Action Platform</title>
  
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-light: #eef3f8;
      --text-main: #0b2545;
      --text-muted: #64748b;
      --text-eyebrow: #8ea2b8;
      --border-color: #e2e8f0;
      --input-border: #e2e8f0;
      --input-bg: #ffffff;
      --btn-primary: #072242;
      --btn-hover: #04172f;
      --link-teal: #0284c7;
      --link-hover: #0369a1;
      --radius-md: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .signup-container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .signup-card {
      background: transparent;
      padding: 20px;
    }

    .eyebrow {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-eyebrow);
      margin-bottom: 8px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: 14.5px;
      color: var(--text-muted);
      margin-bottom: 32px;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      font-size: 14.5px;
      color: #1e293b;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder {
      color: #94a3b8;
    }

    .form-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    .password-toggle-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-eyebrow);
      cursor: pointer;
      padding: 4px 6px;
      text-transform: uppercase;
      font-family: inherit;
    }

    .password-toggle-btn:hover {
      color: var(--text-main);
    }

    .btn-register {
      width: 100%;
      height: 50px;
      background-color: var(--btn-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-register:hover {
      background-color: var(--btn-hover);
    }

    .btn-register:active {
      transform: scale(0.99);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0 20px 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: #cbd5e1;
    }

    .divider-text {
      padding: 0 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-eyebrow);
      text-transform: uppercase;
    }

    .footer-help {
      text-align: center;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .footer-help a {
      color: var(--link-teal);
      font-weight: 600;
      text-decoration: none;
    }

    .footer-help a:hover {
      text-decoration: underline;
    }

    .alert-box {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
    }

    .alert-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #16a34a;
    }
  </style>
</head>
<body>

  <div class="signup-container">
    <div class="signup-card">
      <div class="eyebrow">NEW USER REGISTRATION</div>
      <h1 class="page-title">Create account</h1>
      <p class="page-subtitle">Choose a username and password to create your account.</p>

      {% if error %}
      <div class="alert-box alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      {% if success %}
      <div class="alert-box alert-success">
        <i class="fa-solid fa-circle-check"></i>
        <span>{{ success }}</span>
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('signup') }}">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-input" 
              placeholder="jane.doe" 
              value="{{ username | default('') }}" 
              required 
              autofocus
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="signup-password" 
              name="password" 
              class="form-input" 
              placeholder="••••••••" 
              required
            >
            <button 
              type="button" 
              id="togglePasswordBtn" 
              class="password-toggle-btn" 
              onclick="togglePasswordVisibility()"
            >SHOW</button>
          </div>
        </div>

        <button type="submit" class="btn-register">
          <span>Create Account</span>
        </button>
      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">OR</div>
        <div class="divider-line"></div>
      </div>

      <div class="footer-help">
        Already have an account? <a href="{{ url_for('login') }}">Login</a>
      </div>
    </div>

    <!-- Signup Page 2026 Footer -->
    <div style="text-align: center; margin-top: 24px; font-size: 12px; color: #94a3b8; font-weight: 500;">
      Trend2Action Platform &nbsp;|&nbsp; &copy; 2026 All rights reserved.
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const input = document.getElementById('signup-password');
      const btn = document.getElementById('togglePasswordBtn');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'HIDE';
      } else {
        input.type = 'password';
        btn.textContent = 'SHOW';
      }
    }
  </script>

</body>
</html>
